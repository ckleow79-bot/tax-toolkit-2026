<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presenter · Tax Compliance Toolkit 2026</title>
<meta name="robots" content="noindex">
<link rel="icon" href="ds/assets/favicon.svg">
<link rel="stylesheet" href="ds/styles.css"><link rel="stylesheet" href="css/app.css">
<style>
  body { background: var(--bk-ink); color: var(--text-on-dark); }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 20px; display: grid; gap: 20px; grid-template-columns: 340px 1fr; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  .panel { background: var(--surface-card); color: var(--text-body); border-radius: var(--r-lg); padding: 20px; }
  .stage { background: var(--surface-page); color: var(--text-body); border-radius: var(--r-xl); padding: 32px; min-height: 70vh; }
  .stage h2 { font-size: clamp(1.8rem, 3vw, 2.8rem); margin: 8px 0 24px; }
  .stage .bar { font-size: 22px; grid-template-columns: 1fr auto; } .stage .bar .track { height: 30px; } .stage .bar .mono { font-size: 24px; font-weight: 700; color: var(--text-strong); }
  .plist button { display: block; width: 100%; text-align: left; border: 1.5px solid var(--border-base); background: var(--surface-card); border-radius: var(--r-sm); padding: 8px 10px; margin-bottom: 6px; cursor: pointer; font-size: 14px; }
  .plist button.on { border-color: var(--bk-blue); background: var(--bk-blue-100); font-weight: 700; }
  .plist h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-muted); font-family: var(--font-body); margin: 12px 0 6px; }
  .ctl { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .qr { background: #fff; border-radius: var(--r-md); padding: 12px; display: inline-block; }
  .count { font-family: var(--font-mono); font-size: 18px; color: var(--text-muted); }
  .top-q { font-size: 22px; padding: 14px 0; border-bottom: 1px solid var(--border-soft); display: flex; gap: 16px; }
  .top-q b { font-family: var(--font-mono); color: var(--bk-blue); min-width: 40px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="panel" id="login">
      <img src="ds/assets/logo.svg" alt="B & K Academy" style="height:30px"><h3 style="margin:14px 0 6px">Presenter sign-in</h3><p class="sub">Sign in with the Google account named in the security rules. Other accounts can sign in but cannot open polls.</p>
      <button class="btn" id="go">Sign in with Google</button><p class="sub" id="err"></p>
    </div>
    <div class="panel" id="ctl" hidden>
      <div style="display:flex;justify-content:space-between;align-items:center"><b>Controls</b><button class="iconbtn" id="out">Sign out</button></div>
      <div class="ctl"><button class="btn" id="open">Open</button><button class="btn ghost" id="close">Close</button><button class="btn ghost" id="reveal">Reveal</button><button class="btn ghost" id="hide">Hide</button></div>
      <div class="ctl"><button class="btn ghost" id="view-poll">Show poll</button><button class="btn ghost" id="view-q">Show questions</button><button class="btn ghost" id="view-qr">Show join QR</button></div>
      <div class="ctl"><button class="btn ghost" id="reset">Clear votes on this poll</button></div>
      <div class="plist" id="plist"></div>
    </div>
  </div>
  <div class="stage" id="stage"><p class="sub">Sign in to start.</p></div>
</div>
<script src="js/vendor/qrcode.js"></script>
<script type="module" src="js/presenter.js"></script>
</body>
</html>
